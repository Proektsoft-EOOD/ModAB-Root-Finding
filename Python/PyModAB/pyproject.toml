[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pymodab"
version = "1.0.7"
description = "Fast and robust root-finding library using the Modified Anderson-Bjork method"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Ganchovski, N.; Smith, O.; Rackauckas, C.; Tomov, L.; Traykov, A."}
]
keywords = ["root-finding", "nonlinear equations", "numerical methods", "computational mathematics", "optimization", "bisection", "Anderson-Bjork"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/Proektsoft-EOOD/ModAB-Root-Finding/tree/main/Python/PyModAB"
Repository = "https://github.com/Proektsoft-EOOD/ModAB-Root-Finding/tree/main/Python/PyModAB"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pymodab = ["*.dll", "*.so", "*.dylib", "*.lib", "py.typed"]

[tool.setuptools.exclude-package-data]
pymodab = ["*.c"]

[tool.cibuildwheel]
# One abi3 wheel per platform, usable by CPython 3.8 and later
build = "cp39-*"   # built with 3.9, tagged cp38-abi3 by setup.py
skip = "*-win32 *_i686"
build-frontend = "build"
test-command = "python -c \"import math, pymodab; assert pymodab.NATIVE, 'native extension missing'; assert abs(pymodab.find_root(lambda x: math.cos(x) - x, 0, 1) - 0.7390851332151607) < 1e-15\""

# A universal2 wheel can only be tested on the runner's own architecture
test-skip = "*-macosx_universal2:x86_64"
